[project]
name = "python3-13-example-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DA-IPES", email = "276120903+DA-IPES@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ai-edge-litert>=2.3.0",
    "astro-pi-orbit>=2.0.2",
    "exif>=1.6.1",
    "gpiozero>=2.0.1.post3",
    "logzero>=1.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "picamzero>=1.1.0 ; sys_platform == 'linux'",
    "pillow>=13.0.0",
    "reverse-geocoder>=1.5.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sense-hat>=2.6.0",
    "skyfield>=1.55",
]

[project.scripts]
python3-13-example-repo = "python3_13_example_repo:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
